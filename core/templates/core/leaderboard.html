{% extends 'core/base.html' %}
{% load static %}
{% block title %}Leaderboard - Tree Puzzle{% endblock %}
{% block etc %}
<script type="module" src="{% static 'core/js/leaderboard.js' %}?v=20261123" defer></script>
<link href="{% static 'core/css/leaderboard.css' %}?v=20261123" rel="stylesheet">
{% endblock %}
{% block content %}
<p hidden id="leaderboard_api_url">{% url 'core:api:leaderboard' %}</p>
<div class="leaderboard-shell d-flex flex-column gap-3">
  <div class="d-flex align-items-center justify-content-between">
    <h1 class="h3 mb-0 fw-bold">Leaderboard</h1>
    <a class="btn btn-sm btn-outline-success fw-semibold" href="{% url 'core:web:main' %}">게임으로 돌아가기</a>
  </div>

  <div class="tp-card overflow-hidden">
    <div class="card-header bg-white border-bottom px-3 pt-3 pb-0">
      <ul class="nav nav-tabs border-bottom-0">
        <li class="nav-item">
          <a class="nav-link active fw-semibold" id="rank_total" href="#">전체</a>
        </li>
        <li class="nav-item">
          <a class="nav-link fw-semibold" id="rank_weekly" href="#">주간</a>
        </li>
        <li class="nav-item">
          <a class="nav-link fw-semibold" id="rank_month" href="#">월간</a>
        </li>
        <li class="nav-item">
          <a class="nav-link fw-semibold" id="rank_user" href="#">유저별 최고</a>
        </li>
      </ul>
    </div>
    <div class="card-body p-3">
      <ul class="list-group list-group-flush" id="leaderboard"></ul>
      <ul class="pagination justify-content-center mt-3 mb-0">
        <li class="page-item"><a href="#" class="page-link" id="prev">이전</a></li>
        <div id="pages" class="d-flex"></div>
        <li class="page-item"><a href="#" class="page-link" id="next">다음</a></li>
      </ul>
    </div>
  </div>
</div>
{% endblock %}
