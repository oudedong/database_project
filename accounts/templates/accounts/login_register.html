{% extends 'core/base.html' %}
{% load static %}
{% block title %}로그인 / 회원가입 - Tree Puzzle{% endblock %}
{% block etc %}
<script defer src="{% static 'accounts/js/login_register.js' %}"></script>
{% endblock %}
{% block content %}
<div id="login_api_url" hidden>{% url 'accounts:api:login' %}</div>
<div id="register_api_url" hidden>{% url 'accounts:api:register' %}</div>
<div class="row justify-content-center" id="accountBlock">
  <div class="col-12 col-sm-9 col-md-6 col-lg-4">
    <div class="tp-card p-4 d-flex flex-column gap-3">
      <div class="d-flex justify-content-between align-items-center">
        <h1 class="h4 mb-0 fw-bold text-success">계정</h1>
        <button type="button" id="modeButton" class="btn btn-sm btn-outline-success"></button>
      </div>

      <form class="d-flex flex-column gap-2" id="loginForm" method="post">
        {% csrf_token %}
        <div>
          <label class="form-label small fw-semibold mb-1">아이디</label>
          <input class="form-control" name="username" autocomplete="username" required>
        </div>
        <div>
          <label class="form-label small fw-semibold mb-1">비밀번호</label>
          <input class="form-control" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-success mt-2 fw-semibold">로그인</button>
      </form>

      <form class="d-flex flex-column gap-2" id="registerForm" method="post" hidden>
        {% csrf_token %}
        <div>
          <label class="form-label small fw-semibold mb-1">아이디</label>
          <input class="form-control" name="username" autocomplete="username" required>
        </div>
        <div>
          <label class="form-label small fw-semibold mb-1">비밀번호</label>
          <input class="form-control" name="password1" type="password" autocomplete="new-password" required>
        </div>
        <div>
          <label class="form-label small fw-semibold mb-1">비밀번호 확인</label>
          <input class="form-control" name="password2" type="password" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-success mt-2 fw-semibold">회원가입</button>
      </form>

      <div id="error"></div>
    </div>
  </div>
</div>
{% endblock %}
